name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack ZIP archive
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            echo "Found ZIP archive, extracting..."
            unzip -o *.zip
          fi
          ls -la

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Setup Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build
        env:
          NODE_ENV: production
          VITE_API_URL: https://ais-dev-dr6keeeyfv4dvq7hgxhrau-869275912427.europe-west2.run.app

      - name: Setup Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Grant Executable Permissions to Gradle
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          cd ..
          mkdir -p output-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output-apk/NanoMock-Studio-debug.apk

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: NanoMock-Studio-APK
          path: output-apk/*.apk
          retention-days: 30
